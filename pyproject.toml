[project]
name = "beacon"
version = "0.2.0"
description = "local network discovery, inventory and monitoring with a CLI, live web app and standalone reports"
readme = "readme.md"
requires-python = ">=3.11"
license = { file = "license.md" }
authors = [{ name = "rezzt-dev" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "psutil>=5.9",
  "scapy>=2.5",
  # beacon live: a small asgi app and server, pure python, no node or browser needed for the cli
  "starlette>=1.0",
  "uvicorn>=0.30",
]

[project.scripts]
beacon = "beacon.cli.main:run"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27",
]
# browser tests (tests/test_browser.py); after installing, run `python -m playwright install chromium`
browser = [
  "playwright>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/beacon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
markers = ["browser: drives a real browser (needs playwright and its chromium)"]

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E111", "E114", "E117", "E501", "B008"]

[tool.ruff.lint.isort]
lines-after-imports = 2
