name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run ruff check app tests scripts

  test:
    # unit, storage, api and cli tests: simulated network only, nothing leaves the runner
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run pytest -q -m "not browser"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev --group browser
      - run: uv run python -m playwright install --with-deps chromium
      - run: uv run pytest -q -m browser

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv build
      - name: install the wheel in a clean environment and check it ships its web assets
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          cd /tmp
          /tmp/clean/bin/beacon --version
          BEACON_HOME=/tmp/home /tmp/clean/bin/beacon live --url
          /tmp/clean/bin/python - <<'EOF'
          from beacon.web.server import STATIC
          import beacon.export.html_export as report
          for name in ("index.html", "login.html", "assets/js/main.js", "assets/css/app.css"):
              assert (STATIC / name).is_file(), name
          assert len(report._STYLE) > 1000 and len(report._SCRIPT) > 1000
          print("assets ok")
          EOF
